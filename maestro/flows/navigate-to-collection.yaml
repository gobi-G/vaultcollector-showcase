appId: com.vaultcollector.app
---
- runFlow: login.yaml

# Navigate to collection tab
- tapOn: "tab-collection"
- extendedWaitUntil:
    visible:
      id: "collection-create-btn"
    timeout: 5000

# Tap first collection
- tapOn:
    id: "collection-item-0"
- extendedWaitUntil:
    visible:
      id: "collection-detail"
    timeout: 5000
